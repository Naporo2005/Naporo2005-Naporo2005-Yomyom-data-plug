<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Checkout — Apex Data Plug</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="page">

    <header class="topbar">
      <button class="back-btn" onclick="window.location.href='index.html'" aria-label="Back">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M15 18l-6-6 6-6" /></svg>
      </button>
      <div class="brand">
        <div class="brand-name">
          Checkout
        </div>
      </div>
    </header>

    <main class="content">
      <div class="summary-card fade-up">
        <div class="summary-row">
          <span class="k">NETWORK</span>
          <span class="v" id="sumNetwork">—</span>
        </div>
        <div class="summary-row">
          <span class="k">BUNDLE</span>
          <span class="v" id="sumBundle">—</span>
        </div>
        <div class="summary-row summary-total">
          <span class="k">TOTAL</span>
          <span class="v" id="sumPrice">—</span>
        </div>
      </div>

      <form id="checkoutForm" novalidate>
        <div class="field">
          <label for="beneficiary" id="beneficiaryLabel">Beneficiary number (receives the data)</label>
          <input type="tel" id="beneficiary" inputmode="numeric" placeholder="024 000 0000" maxlength="10" autocomplete="off">
          <div class="field-error" id="beneficiaryError">
            That doesn't look like a valid number for this network.
          </div>
        </div>

        <div class="field">
          <label for="confirmBeneficiary">Confirm beneficiary number</label>
          <input type="tel" id="confirmBeneficiary" inputmode="numeric" placeholder="024 000 0000" maxlength="10" autocomplete="off">
          <div class="field-error" id="confirmError">
            Numbers don't match.
          </div>
        </div>

        <div class="field">
          <label for="payerNumber">Number to be charged (Mobile Money)</label>
          <input type="tel" id="payerNumber" inputmode="numeric" placeholder="024 000 0000" maxlength="10" autocomplete="off">
          <div class="field-hint">
            Pay with MTN, Telecel, or AirtelTigo Mobile Money. Can be the same
            as <b>Beneficiary Number</b>, or different if you're paying for
            <b>Someone Else.</b>
          </div>
          <div class="field-error" id="payerError">
            Enter a valid Mobile Money number.
          </div>
        </div>
      </form>
    </main>

    <div class="btn-fixed">
      <button class="btn btn-primary" id="payBtn">
        <span class="spinner"></span>
        <span class="btn-text">Proceed to Payment</span>
      </button>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <script src="https://js.paystack.co/v2/inline.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="supabase-client.js"></script>
  <script src="checkout.js"></script>
</body>
</html>
