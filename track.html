<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Track Your Order — Apex Data Plug</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="page">

  <header class="topbar">
    <button class="back-btn" onclick="window.location.href='index.html'" aria-label="Back">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <div class="brand">
      <div class="brand-name">Track Order</div>
    </div>
  </header>

  <main class="content">
    <div class="hero fade-up" style="padding-top:4px;">
      <h1 style="font-size:24px;">Check your order status</h1>
      <p>Enter the beneficiary number your data was sent to, and we'll show you every order tied to it.</p>
    </div>

    <div class="field">
      <label for="trackPhone">Beneficiary number</label>
      <input type="tel" id="trackPhone" inputmode="numeric" placeholder="024 000 0000" maxlength="10" autocomplete="off">
      <div class="field-error" id="trackError">Enter a valid 10-digit Ghana mobile number.</div>
    </div>

    <button class="btn btn-primary" id="trackBtn" style="margin-bottom:24px;">
      <span class="spinner"></span>
      <span class="btn-text">Check Orders</span>
    </button>

    <div id="resultsList"></div>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="supabase-client.js"></script>
<script src="track.js"></script>
</body>
</html>
